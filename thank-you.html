<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Sanjay Kumar</title>
  <meta name="description" content="Thank you for contacting Sanjay Kumar.">
  <meta name="theme-color" content="#050505">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/thank-you.css">
  <link rel="icon" href="images/monogram.png" type="image/png">
</head>
<body data-theme="dark">

  <!-- Background layers (match portfolio) -->
  <div class="bg-aurora">
    <div class="aurora-blob aurora-1"></div>
    <div class="aurora-blob aurora-2"></div>
    <div class="aurora-blob aurora-3"></div>
  </div>
  <div class="bg-grid-overlay"></div>
  <div class="bg-noise"></div>
  <canvas id="confettiCanvas"></canvas>

  <main class="thank-you-container">
    <div class="thank-you-card">

      <!-- Animated success icon -->
      <div class="success-animation">
        <div class="success-ring"></div>
        <div class="success-ring success-ring-2"></div>
        <div class="success-glow"></div>
        <svg class="success-check" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="check-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="check-path" fill="none" d="M14 27l8 8 16-16"/>
        </svg>
      </div>

      <span class="eyebrow">Message Delivered</span>
      <h1>Thank You<span class="dot">.</span></h1>
      <p>I've received your message and will get back to you within <strong>24–48 hours</strong>. Looking forward to connecting with you.</p>

      <!-- Countdown -->
      <p class="redirect-hint">
        <i class='bx bx-time-five'></i>
        Redirecting in <span id="countdown">10</span>s
      </p>

      <!-- Actions -->
      <div class="action-buttons">
        <a href="index.html" class="btn btn-primary">
          <i class='bx bx-home-alt'></i> Back to Home
        </a>
        <a href="index.html#contact" class="btn btn-outline">
          <i class='bx bx-envelope'></i> Send Another
        </a>
      </div>

      <!-- Socials -->
      <div class="social-links">
        <a href="https://github.com/Sanjaykumar-tech" target="_blank" rel="noopener" aria-label="GitHub"><i class='bx bxl-github'></i></a>
        <a href="https://www.linkedin.com/in/sanjay-kumar-7a8731324/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class='bx bxl-linkedin'></i></a>
        <a href="https://www.instagram.com/sanjaykumar.tech/" target="_blank" rel="noopener" aria-label="Instagram"><i class='bx bxl-instagram'></i></a>
        <a href="https://x.com/sanjaykumar_x" target="_blank" rel="noopener" aria-label="Twitter"><i class='bx bxl-twitter'></i></a>
      </div>

      <!-- Theme dots -->
      <div class="theme-dots">
        <button class="theme-dot active" data-theme="dark" style="--swatch:#050505" aria-label="Dark"></button>
        <button class="theme-dot" data-theme="midnight" style="--swatch:#0a0f2c" aria-label="Midnight"></button>
        <button class="theme-dot" data-theme="ocean" style="--swatch:#04213a" aria-label="Ocean"></button>
        <button class="theme-dot" data-theme="forest" style="--swatch:#052019" aria-label="Forest"></button>
        <button class="theme-dot" data-theme="light" style="--swatch:#f5f5f7" aria-label="Light"></button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="js/thank-you.js"></script>
</body>
</html>
