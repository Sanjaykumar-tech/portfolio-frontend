<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sanjay Kumar</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="images/monogram.png" type="image/png">
</head>
<body data-theme="dark">

  <!-- Background -->
  <div class="bg-aurora">
    <div class="aurora-blob aurora-1"></div>
    <div class="aurora-blob aurora-2"></div>
  </div>
  <div class="bg-grid-overlay"></div>
  <div class="bg-noise"></div>

  <!-- Theme Dock -->
  <div class="theme-dock" id="themeDock">
    <button class="theme-swatch active" data-theme="dark" style="--swatch:#050505" title="Dark"></button>
    <button class="theme-swatch" data-theme="midnight" style="--swatch:#0a0f2c" title="Midnight"></button>
    <button class="theme-swatch" data-theme="ocean" style="--swatch:#04213a" title="Ocean"></button>
    <button class="theme-swatch" data-theme="forest" style="--swatch:#052019" title="Forest"></button>
    <button class="theme-swatch" data-theme="light" style="--swatch:#f5f5f7" title="Light"></button>
  </div>

  <main class="auth-container">
    
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
      <i class='bx bx-left-arrow-alt'></i> Back to Home
    </a>

    <div class="auth-card">
      
      <!-- Logo -->
      <div class="auth-logo">
        <img src="images/monogram.png" alt="SK Monogram">
        <h2>Welcome Back<span class="logo-dot">.</span></h2>
        <p>Login to continue to your account</p>
      </div>

      <!-- Form -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class='bx bx-envelope'></i>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class='bx bx-lock-alt'></i>
            <input type="password" id="password" placeholder="••••••••" required>
            <i class='bx bx-show toggle-pass' id="togglePass"></i>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Sign In <i class='bx bx-right-arrow-alt'></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Or continue with</span>
      </div>

      <!-- Social Login -->
      <div class="social-login">
        <button class="btn-social"><i class='bx bxl-google'></i> Google</button>
        <button class="btn-social"><i class='bx bxl-github'></i> GitHub</button>
      </div>

      <!-- Footer -->
      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>

    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
