<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Sanjay Kumar</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .error-container { background: var(--bg-card); padding: 50px; border-radius: 20px; border: 1px solid var(--border-color); max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .error-code { font-size: 6rem; font-weight: 800; color: var(--accent-light); line-height: 1; text-shadow: 0 0 30px var(--accent-glow); margin-bottom: 10px; }
    .error-title { font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 16px; }
    .error-text { color: var(--text-muted); margin-bottom: 30px; }
    .error-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--accent); color: #000; text-decoration: none; border-radius: 8px; font-weight: 600; font-family: var(--font-heading); transition: all 0.3s; }
    .error-btn:hover { background: var(--accent-light); transform: translateY(-3px); box-shadow: 0 10px 20px var(--accent-glow); }
  </style>
</head>
<body data-theme="dark">
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-text">Oops! The page you are looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="error-btn">
      <i class='bx bx-home-alt'></i> Back to Home
    </a>
  </div>
  <script>
    // Theme apply for 404 page
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
